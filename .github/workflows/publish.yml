name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { name, version } = require('./package.json');
          assert.match(version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Release tag must match package.json');
          const template = fs.readFileSync('templates/resolver.html', 'utf8');
          assert.ok(template.includes(`${name} v${version}</span>`), 'Update the footer version');
          assert.ok(template.includes(`/resolver/resolver.css?v=${version}"`), 'Update the stylesheet version');
          NODE
      - name: Install publishing tools
        run: npm install --global npm@11
      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Publish with npm trusted publishing
        run: npm publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
